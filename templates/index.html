<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Agriculture Advisory System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <div class="container">

        <h1>🌱 Smart Crop Recommendation System</h1>

        <form id="predictionForm">

            <label for="N">Nitrogen (N)</label>
            <input type="text" id="N" name="N" placeholder="Enter Nitrogen value" required>

            <label for="P">Phosphorus (P)</label>
            <input type="text" id="P" name="P" placeholder="Enter Phosphorus value" required>

            <label for="K">Potassium (K)</label>
            <input type="text" id="K" name="K" placeholder="Enter Potassium value" required>

            <label for="temperature">Temperature (°C)</label>
            <input type="text" id="temperature" name="temperature" placeholder="Enter temperature" required>

            <label for="humidity">Humidity (%)</label>
            <input type="text" id="humidity" name="humidity" placeholder="Enter humidity" required>

            <label for="ph">pH Value</label>
            <input type="text" id="ph" name="ph" placeholder="Enter soil pH" required>

            <label for="rainfall">Rainfall (mm)</label>
            <input type="text" id="rainfall" name="rainfall" placeholder="Enter rainfall" required>

            <button type="button" onclick="submitForm()">
                Predict Crop
            </button>

        </form>

        <!-- Result Section -->
        <div class="result" id="resultBox" style="display:none;">

            <h2 id="cropResult"></h2>

            <h3 id="fertilizerResult"></h3>

        </div>

    </div>

<script>

function submitForm() {

    const form = document.getElementById('predictionForm');

    const formData = new FormData(form);

    const data = {};

    formData.forEach((value, key) => {
        data[key] = parseFloat(value);
    });

    fetch('/predict', {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify(data)

    })

    .then(response => response.json())

    .then(data => {

        const resultBox = document.getElementById('resultBox');

        resultBox.style.display = "block";

        if (data.error) {

            document.getElementById('cropResult').innerText =
                "Error: " + data.error;

            document.getElementById('fertilizerResult').innerText = "";

        } else {

            document.getElementById('cropResult').innerText =
                "🌾 Recommended Crop: " + data.crop;

            document.getElementById('fertilizerResult').innerText =
                "🧪 Recommended Fertilizer: " + data.fertilizer;
        }

    })

    .catch(error => {

        document.getElementById('resultBox').style.display = "block";

        document.getElementById('cropResult').innerText =
            "Error: " + error;

    });
}

</script>

</body>
</html>
